name: CI

on:
  pull_request:
  push:
    branches:
      - "develop"
      - "main"
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os-alias:
          - ubuntu
          - macos
          - windows
        include:
          - os-alias: ubuntu
            os: ubuntu-24.04
          - os-alias: macos
            os: macos-15
          - os-alias: windows
            os: windows-2025
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3
      - name: Setup .NET environment
        uses: actions/setup-dotnet@v5
      - name: Build a project
        run: dotnet build
      - name: Run tests
        run: dotnet test

  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3
      - name: Setup .NET environment
        uses: actions/setup-dotnet@v5
      - name: Run formatter in check mode
        run: dotnet format --verify-no-changes

  prettier:
    name: Prettier
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3
      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Run formatter in check mode
        run: npx prettier -c "**.{json,md,yaml,yml}"
